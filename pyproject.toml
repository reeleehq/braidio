[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "braidio"
version = "0.0.71"
description = "Weave narration with extracted media segments into audiovisual productions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "audio",
    "tts",
    "podcast",
    "narration",
    "ffmpeg",
    "elevenlabs",
]
# Development Status is 3 - Alpha on purpose: the README says the engine is early
# and "APIs will move quickly", and the version is still 0.0.x. No Typing :: Typed
# (no py.typed marker ships). Multimedia :: Video is claimed now that
# `braidio[video]` renders a Ken Burns film over stills — an optional extra, but a
# real render path, not roadmap.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "Thor Whalen" },
]
# Functional core deps. Also requires `ffmpeg`/`ffprobe` on PATH (system dep).
# mixing>=0.0.28: narrate() calls text_to_speech(return_cache_status=...) (added
#   there) so a mixing-cache hit reports cost_usd_actual=$0 (braidio#8).
dependencies = [
    "mixing[media]>=0.0.28",
    "elevenlabs",
]

[project.urls]
Homepage = "https://github.com/thorwhalen/braidio"
Repository = "https://github.com/thorwhalen/braidio"
Documentation = "https://thorwhalen.github.io/braidio"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "build",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
# The nw-app layer (graph body schemas, render provenance, partial re-render, an
# nw.Project). `import braidio` never needs these — the layer loads only when
# present (braidio.HAS_GRAPH / HAS_NW).
graph = ["lacing"]
# The video layer (`braidio.video`): a Ken Burns film over caller-supplied stills,
# muxed under a rendered episode. `burns` owns the pan/zoom motion; braidio owns
# only where the cuts fall, which needs the beat timeline it already produces.
#
# Declared here rather than leaned on: `mixing` happens to pull `burns` and
# `pillow` transitively today, so this extra is usually already satisfied — but a
# transitive dep is not a contract, and `mixing` is free to drop either. An
# explicit extra is what makes `braidio.video` honest about what it needs.
#
# NOT a hard dependency, and deliberately not `reelee` or `artful`: reelee imports
# braidio (so the reverse would be circular), and nothing here needs a storyboard
# model. See braidio/video.py's docstring for the boundary.
# burns>=0.0.15: ships `resolve_move` (the named-move vocabulary,
# thorwhalen/burns#20), `MOVES` and `RESOLVER_IMPL_VERSION` for real —
# braidio.transforms used to carry a shim with a second implementation of the
# eight moves for the window before burns released it; that shim is gone
# (thorwhalen/braidio#74 item 2), so this floor is now load-bearing rather
# than advisory. The floor also still covers 0.0.11's `sample_box_exact`
# (sub-pixel frame sampling — below it a slow push emits runs of
# pixel-identical frames, up to ~75% consecutive duplicates, then snaps:
# visibly stepped motion, a defect in the rendered output, not an
# optimisation). Verified against the published wheels, not the git log: wads
# CI bumps the version in a commit AFTER the feature, so the fix commit's own
# pyproject still reads the old number and the log makes it look one commit
# later than it is (the same trap documented for nw#27 below).
# burns>=0.0.16: `resolve_move(content_box=)` + RESOLVER_IMPL_VERSION 2 — the
# requested zoom is honoured on a detailed photograph, and saliency is confined
# to the still on its canvas (thorwhalen/burns#21). `resolver_identity` refuses
# an older resolver at plan time.
# tituli: the text pass (`video_cut.finish`) composites labels, cards and the
# credits roll through it; burning captions in uses mixing (already a core dep).
video = ["burns>=0.0.16", "pillow", "tituli>=0.0.4"]
# nw>=0.0.29: `derive_provenance` takes the Transform instance rather than
# (name, version) — it reads `name` and `impl_version` off it (nw#27). The break is
# at CALL time, not import time, so an older nw installs cleanly and then fails
# inside plan(); the floor is what stops that.
# 0.0.29 and NOT 0.0.28: wads cuts the version bump in a separate commit AFTER the
# feature, so nw#27's git log reads one release earlier than it ships. Verified by
# reading the published artifacts, not the changelog — 0.0.28 still has the old
# signature; 0.0.29 is the first release with the new one.
# nw>=0.0.51: `execute(..., secrets=)` — the per-caller credential seam the two
# paid transforms declare and `weave_project(api_key=)` threads (braidio#58, nw#78).
# nw>=0.0.55: the project-factory PLACEMENT contract (`projects_dir`, nw#84). The
# commentary_weave factory accepts it on any nw — an old one simply never passes it
# — but `nw.can_place_genre_project` and `create_genre_project(projects_dir=)` are
# what a HOST needs to place a commentary project in its own world, and they exist
# only from 0.0.55. Below it the genre is still creatable, only never host-placeable,
# so the floor is raised rather than guarded at runtime.
# Same wads caveat as above: the feature commit is one release before the bump.
# nw>=0.0.58: `nw.transforms.register_asset_refs` (nw#55, landed in nw#88, first
# published in 0.0.58). braidio declares `production-structure/v1`'s sting and bed
# asset ids at import of `braidio.transforms`, so an older nw fails at IMPORT —
# the floor is what stops that.
nw-app = ["lacing", "nw>=0.0.65", "falaw[fal]"]
# The MCP server (`braidio.mcp`): a Claude.ai connector's tool surface + usage
# metering. `fastmcp` + `py2mcp` build and serve it; the nw-app powers the project
# and weave tools. The usage-ledger store is dependency-injected by the connector
# (e.g. a `dol` file store).
# py2mcp>=0.1.9: build_server passes instructions= (added in 0.1.9) to mk_http_app.
# dol>=0.3.57: the asset tools use dol.content (ContentRef + content-addressed
#   store), added in that release — pin the floor so installs don't resolve an
#   older dol without it.
# nw>=0.0.58: see the nw-app note above (the `secrets=` seam, braidio#58; the
#   asset-ref declarations `braidio.transforms` makes on import, nw#55).
mcp = ["fastmcp", "py2mcp>=0.1.9", "pypdf", "dol>=0.3.57", "lacing", "nw>=0.0.65", "falaw[fal]", "yb[download]>=0.1.7"]
# The importer (`braidio.importing`): a finished commentary production ->
# a real project graph. Needs the nw-app layer (it writes annotations) plus
# `illustration` for licence normalization.
#
# illustration is NOT vendored and must not be: it owns the canonical mapping
# from the four provider dialects (`CC BY 4.0`, `cc-by-sa-2.0`, `by-sa`, `pd`,
# …) to a canonical code, and a second copy of that table in braidio is how a
# licence gate silently starts dropping images. The importer uses it as a
# GATE — an unrecognised code fails the import rather than being written — so
# the dependency is load-bearing, not a convenience.
#
# illustration>=0.0.11: `illustration.licensing.normalize_license` +
# `LICENSE_ALIASES`. Verified by reading the PUBLISHED 0.0.11 sdist, not the
# changelog — the same wads caveat noted for nw and burns above (the version
# bump lands in a commit AFTER the feature, so the git log reads one release
# early).
importing = ["illustration>=0.0.11", "lacing", "nw>=0.0.65", "falaw"]

# Packaging. The two shipped skills live at braidio/data/skills/<name>/ with
# relative symlinks from .claude/skills/. hatchling walks the tree with
# followlinks and remembers each REAL directory it has visited, so the
# `.claude/skills/<name>` symlinks (walked first, alphabetically) mark the real
# `braidio/data/skills/<name>` dirs as seen and they are skipped. Exclusion
# alone does not help — it filters files after the walk — hence
# `skip-excluded-dirs`. Without both, the sdist carried `.claude/skills/...`
# (and, once worktrees existed, every file of every worktree under .claude/)
# and dropped the canonical copies; CI builds the wheel from the sdist, so
# no skill shipped (verified on the published 0.0.43 wheel: 0 SKILL.md).
# tests/test_packaging.py builds sdist -> wheel to keep it fixed.
[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github", "scrap"]

[tool.hatch.build.targets.wheel]
packages = ["braidio"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
# wads CI runs `pytest --doctest-modules` with NO path argument, so collection is
# driven entirely by `testpaths`. With only "tests" here the package's own doctests
# were never collected (CI stayed green while doctesting nothing). Listing the
# package dir makes `--doctest-modules` reach it — and doubles as an import smoke
# test for every module.
testpaths = [
    "tests",
    "braidio",
]
# EXACTLY what CI passes, and for a reason: every wads runner overrides this
# key wholesale with `-o doctest_optionflags='ELLIPSIS IGNORE_EXCEPTION_DETAIL'`
# (run-tests-uv, run-tests and windows-tests all do). Any difference disagrees
# in BOTH directions — NORMALIZE_WHITESPACE on here and off there makes a
# doctest that leans on it pass locally and fail in CI; IGNORE_EXCEPTION_DETAIL
# off here and on there makes one whose traceback detail drifts pass in CI and
# fail locally. Doctests in this repo are guards, not decoration (see the
# guardrails section of .claude/CLAUDE.md), so the instrument that runs them
# must be configured like the one that grades them. Same trap is recorded in
# dol, an and ocracy.
doctest_optionflags = [
    "ELLIPSIS",
    "IGNORE_EXCEPTION_DETAIL",
]

# System dependencies CI must install (wads `install-system-deps` action).
# braidio's weave/extract/render primitives shell out to ffmpeg; without this
# the ffmpeg-dependent tests fail in CI (they had been red since 2026-07-27).
[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
check.windows = "where ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"
install.windows = "choco install ffmpeg -y --no-progress"

[tool.wads.ci]
project_name = ""

# Install the `mcp` extra in CI so the MCP-server tests (fastmcp + py2mcp + the
# nw-app) actually run — without this, tests/test_mcp.py and the nw-gated
# tests/test_transforms.py + tests/test_nw_app.py are silently skipped.
# `importing` rides along for the same reason: without `illustration` every
# test in tests/test_importing.py skips itself, and a skipped licence gate is
# exactly the thing nobody notices is not running.
# `video` (burns, pillow, tituli) likewise: without tituli every
# video_cut.finish test skips itself (a post-hoc review of #82 found the new
# overflow test had never run in CI).
[tool.wads.ci.install]
extras = "mcp,importing,video"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
